<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão · Recebi</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #101c34; color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 64px; height: 64px; border-radius: 18px; }
  h1 { margin: 24px 0 8px; font-size: 1.6rem; letter-spacing: -0.02em; }
  p { margin: 0 auto; max-width: 320px; color: rgba(255,255,255,.7); line-height: 1.5; }
  button { margin-top: 24px; padding: 12px 20px; border: 0; border-radius: 12px; background: #c9ff3c; color: #101c34; font-weight: 800; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/recebi/icon-192.png" alt="">
    <h1>Você está sem internet</h1>
    <p>O Recebi precisa de conexão para mostrar seus dados atualizados. Assim que a internet voltar, é só tentar de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
